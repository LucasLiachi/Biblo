server {
    listen 8080;
    server_name localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;

    # CSP: tudo servido pelo próprio Biblo (local-first). worker/blob para Excalidraw e Mermaid.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        proxy_pass http://biblo_api:8000;
        proxy_set_header Host localhost;          # a API só aceita hosts conhecidos (anti-DNS-rebinding)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;                      # SSE do chat
        proxy_cache off;
        proxy_read_timeout 300s;
        client_max_body_size 20m;                 # MAX_UPLOAD_MB=15 + folga do multipart
    }

    location ~ /\. {
        deny all;
    }
}
