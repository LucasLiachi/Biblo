name: verify

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run verify   # design system + typecheck + testes + build

  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: biblo
          POSTGRES_PASSWORD: ci-senha-forte
          POSTGRES_DB: biblo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U biblo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PASSWORD: ci-senha-forte
      BIBLO_TEST_DB: "1"
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q
