<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../tokens.css">
  <link rel="stylesheet" href="../bundle.css">
</head>
<body>
  <aside class="vault-tree">
    <div class="tree-header">
      <span>Arquivos do Vault</span>
      <span style="font-size:11px">3 notas · 1 diagrama</span>
    </div>

    <ul class="tree-list">
      <li>
        <div class="tree-item">
          <div class="tree-item-label">
            <span class="tree-icon tree-icon-folder">📂</span>
            <span>notas</span>
          </div>
        </div>
        <ul class="tree-list" style="padding-left:14px;margin-top:2px">
          <li>
            <a class="tree-item active" href="#">
              <div class="tree-item-label">
                <span class="tree-icon tree-icon-md">📄</span>
                <span>arquitetura.md</span>
              </div>
              <span class="tree-badge" title="4 backlinks">4 🔗</span>
            </a>
          </li>
          <li>
            <a class="tree-item" href="#">
              <div class="tree-item-label">
                <span class="tree-icon tree-icon-md">📄</span>
                <span>regras-negocio.md</span>
              </div>
              <span class="tree-badge">1 🔗</span>
            </a>
          </li>
          <li>
            <a class="tree-item" href="#">
              <div class="tree-item-label">
                <span class="tree-icon tree-icon-md">📄</span>
                <span>especificacao-rag.md</span>
              </div>
            </a>
          </li>
        </ul>
      </li>

      <li>
        <div class="tree-item">
          <div class="tree-item-label">
            <span class="tree-icon tree-icon-folder">📂</span>
            <span>diagramas</span>
          </div>
        </div>
        <ul class="tree-list" style="padding-left:14px;margin-top:2px">
          <li>
            <a class="tree-item" href="#">
              <div class="tree-item-label">
                <span class="tree-icon tree-icon-canvas">🎨</span>
                <span>fluxo-pedidos.excalidraw</span>
              </div>
              <span class="tree-badge" title="Indexado p/ RAG">RAG</span>
            </a>
          </li>
        </ul>
      </li>

      <li>
        <div class="tree-item">
          <div class="tree-item-label">
            <span class="tree-icon tree-icon-folder">📁</span>
            <span>assets</span>
          </div>
        </div>
      </li>
    </ul>
  </aside>
</body>
</html>
