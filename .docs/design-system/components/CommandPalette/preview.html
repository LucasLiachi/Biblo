<!-- @dsCard group="Navegação" height=300 subtitle="Busca de arquivos, conteúdo e comandos (Ctrl/Cmd+K)" -->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../tokens.css">
  <link rel="stylesheet" href="../bundle.css">
</head>
<body style="display:flex;justify-content:center;padding:16px">
  <div class="command-palette" role="dialog" aria-modal="true" aria-label="Paleta de Comandos">
    <div class="command-input-wrapper">
      <span style="color:var(--muted-foreground)">🔍</span>
      <input class="command-input" type="text" placeholder="Buscar notas, diagramas ou executar comando..." value="rag" autofocus>
      <kbd class="kbd">ESC</kbd>
    </div>

    <ul class="command-results" role="listbox">
      <li class="command-item selected" role="option" aria-selected="true">
        <div style="display:flex;align-items:center;gap:10px">
          <span>📄</span>
          <span><strong>especificacao-rag.md</strong> <span style="font-size:12px;color:var(--muted-foreground)">— notas/</span></span>
        </div>
        <kbd class="kbd">↵</kbd>
      </li>

      <li class="command-item" role="option" aria-selected="false">
        <div style="display:flex;align-items:center;gap:10px">
          <span>🎨</span>
          <span><strong>fluxo-rag-hibrido.excalidraw</strong> <span style="font-size:12px;color:var(--muted-foreground)">— diagramas/</span></span>
        </div>
        <kbd class="kbd">↵</kbd>
      </li>

      <li class="command-item" role="option" aria-selected="false">
        <div style="display:flex;align-items:center;gap:10px">
          <span>＋</span>
          <span>Nova nota</span>
        </div>
      </li>
    </ul>
  </div>
</body>
</html>
